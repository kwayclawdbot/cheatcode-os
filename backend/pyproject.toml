[project]
name = "cheatcode-os-backend"
version = "0.1.0"
description = "CheatCode OS — Curated finance media platform with AI intelligence layer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "supabase>=2.0.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "yt-dlp>=2024.0.0",
    "openai>=1.0.0",
    "numpy>=1.26.0",
    "redis>=5.0.0",
    "apscheduler>=3.10.0",
    "stripe>=8.0.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "yfinance>=0.2.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
